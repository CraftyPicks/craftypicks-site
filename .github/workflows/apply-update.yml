name: Apply update

# Why this exists
# ----------------
# Uploading a folder through the GitHub web UI keeps flattening: the files
# land at the repository root instead of inside craftypicks/, and then the
# site build can't find them. This workflow removes the folder-dragging step
# entirely.
#
# How to use it
#   1. Drag the .zip onto the repo's file list and commit it. One file, at the
#      root — there is no folder structure left for the uploader to lose.
#   2. Actions -> "Apply update" -> "Run workflow".
#
# The job unpacks the zip to the paths stored inside it, deletes any stray
# copies of those same files sitting loose at the repository root, removes the
# zip, and commits. If it has nothing to do it says so and exits cleanly
# rather than making an empty commit.

on:
  workflow_dispatch:
    inputs:
      zip:
        description: "Zip file at the repo root (blank = use the newest one)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: apply-update
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Unpack and tidy
        env:
          ZIP_INPUT: ${{ inputs.zip }}
        run: |
          set -euo pipefail

          # Pick the archive. An explicit name wins; otherwise the most
          # recently modified zip at the root, so the common case needs no
          # input at all.
          if [ -n "${ZIP_INPUT}" ]; then
            ZIP="${ZIP_INPUT}"
          else
            ZIP="$(ls -t ./*.zip 2>/dev/null | head -1 || true)"
          fi
          if [ -z "${ZIP:-}" ] || [ ! -f "$ZIP" ]; then
            echo "No zip found at the repository root. Upload one and re-run."
            exit 1
          fi
          echo "Using $ZIP"

          # Refuse an archive that would write outside the repo. A zip is
          # untrusted input even when we made it ourselves.
          if unzip -Z1 "$ZIP" | grep -Eq '^/|(^|/)\.\.(/|$)'; then
            echo "Archive contains absolute or parent paths; refusing."
            exit 1
          fi

          echo "--- files in the archive"
          unzip -Z1 "$ZIP" | grep -v '/$' | tee /tmp/manifest.txt

          unzip -o "$ZIP" -d .

          # Sweep the flattened leftovers: for every file the archive places
          # at, say, craftypicks/_src/render.py, delete a stray render.py
          # sitting at the repository root. Matching on basename keeps this
          # narrow — nothing is removed that the archive didn't just place
          # correctly somewhere else.
          # Never sweep these, even if an archive happens to contain a file
          # of the same name deeper in the tree. They belong at the root.
          protected="README.md LICENSE .gitignore .gitattributes"

          swept=0
          while read -r path; do
            base="$(basename "$path")"
            case " $protected " in *" $base "*) continue ;; esac
            # Only sweep when the archive put the file somewhere other than
            # the root, otherwise we would delete the file we just wrote.
            case "$path" in
              */*) ;;
              *) continue ;;
            esac
            if [ -f "./$base" ]; then
              echo "sweeping stray ./$base"
              rm -f "./$base"
              swept=$((swept + 1))
            fi
          done < /tmp/manifest.txt
          echo "swept $swept stray file(s) from the root"

          rm -f "$ZIP"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "craftypicks-bot"
          git config user.email "craftypicks-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed — the repo already matches the archive."
            exit 0
          fi
          git commit -m "Apply update from uploaded archive"
          # The scheduled job commits to this branch too, so a push can lose a
          # race. Rebase and retry once rather than failing the run.
          git push || (git pull --rebase && git push)

      - name: Show the tree
        run: |
          echo "--- repository root"
          ls -1
          echo "--- craftypicks/"
          ls -1 craftypicks 2>/dev/null || echo "(missing)"
