name: Probe vs-team stat

# Diagnostic only. Reads from MLB's free API, writes nothing, commits nothing.
# Run it once from the Actions tab and paste the log back.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ask MLB every way we can think of
        shell: bash
        run: |
          set -o pipefail
          python3 research/probe_vs.py 2>&1
