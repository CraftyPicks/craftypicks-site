name: Run MLB study

# Manual only. This is a research job, not part of the daily site build —
# it never touches the live plays or the record.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to study, comma-separated"
        required: true
        default: "2023,2024,2025"

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: craftypicks

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pitcher game logs don't change once a season is over, so caching them
      # turns a 5-minute run into a 20-second one.
      - name: Restore cached MLB data
        uses: actions/cache@v4
        with:
          path: craftypicks/research/cache
          # Keep the key free of the seasons input entirely — cache keys can't
          # contain commas, and Actions expressions have no replace() to strip
          # them. A run-scoped key with a shared prefix is the standard trick:
          # it restores the newest cache, then always saves an updated one, so
          # the pitcher logs accumulate across runs instead of freezing.
          key: mlb-statsapi-v1-${{ github.run_id }}
          restore-keys: |
            mlb-statsapi-v1-

      - name: Show where we are
        run: |
          echo "working dir: $(pwd)"
          echo "--- repo root:"; ls -la ..
          echo "--- this folder:"; ls -la
          echo "--- research folder:"; ls -la research || echo "NO research FOLDER HERE"

      - name: Run the study
        shell: bash          # gives us pipefail, so a Python crash fails the step
        run: |
          set -o pipefail
          python research/study_mlb.py --seasons "${{ inputs.seasons }}" 2>&1 | tee study.txt

      # Runs even if the study failed, so the error lands in the summary
      # instead of only in the step log.
      - name: Publish results to the run summary
        if: always()
        run: |
          {
            echo '## MLB starter-quality study'
            echo '```'
            cat study.txt 2>/dev/null || echo "(the study produced no output — see the step log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the derived dataset
        if: success()
        run: |
          git config user.name  "craftypicks-bot"
          git config user.email "bot@users.noreply.github.com"
          # No CSV is a legitimate outcome, not a failure — don't let git's
          # "pathspec did not match" kill the run.
          if ! ls research/*.csv >/dev/null 2>&1; then
            echo "No dataset written; nothing to commit."
            exit 0
          fi
          git add research/*.csv
          if git diff --staged --quiet; then
            echo "No dataset change."
          else
            git commit -m "research: MLB dataset for ${{ inputs.seasons }}"
            git push
          fi
