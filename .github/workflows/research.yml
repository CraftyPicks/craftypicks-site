name: Run MLB study

# Manual only. This is a research job, not part of the daily site build —
# it never touches the live plays or the record.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to study, comma-separated"
        required: true
        default: "2023,2024,2025"

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: craftypicks

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pitcher game logs don't change once a season is over, so caching them
      # turns a 5-minute run into a 20-second one.
      - name: Restore cached MLB data
        uses: actions/cache@v4
        with:
          path: craftypicks/research/cache
          key: mlb-statsapi-${{ inputs.seasons }}-v1

      - name: Run the study
        run: |
          python research/study_mlb.py --seasons "${{ inputs.seasons }}" | tee study.txt

      - name: Publish results to the run summary
        run: |
          {
            echo '## MLB starter-quality study'
            echo '```'
            cat study.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the derived dataset
        run: |
          git config user.name  "craftypicks-bot"
          git config user.email "bot@users.noreply.github.com"
          git add research/*.csv
          if git diff --staged --quiet; then
            echo "No dataset change."
          else
            git commit -m "research: MLB dataset for ${{ inputs.seasons }}"
            git push
          fi
