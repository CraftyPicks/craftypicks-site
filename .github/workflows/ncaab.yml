name: Test NCAAB angles

# Manual only, and it commits nothing — pure research against historical
# closing numbers. Never touches the live plays or the public record.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Build seasons (thresholds are chosen on these)"
        required: true
        default: "2020,2021,2022,2023,2024,2025"
      holdout:
        description: "Held-out season — never used to pick anything"
        required: true
        default: "2026"

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore cached line data
        uses: actions/cache@v4
        with:
          path: research/cache_ncaab
          key: cbbd-lines-v1-${{ github.run_id }}
          restore-keys: |
            cbbd-lines-v1-

      - name: Run the study
        shell: bash
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: |
          set -o pipefail
          python research/study_ncaab.py \
            --seasons "${{ inputs.seasons }}" \
            --holdout "${{ inputs.holdout }}" 2>&1 | tee ncaab.txt

      - name: Publish to the run summary
        if: always()
        run: |
          {
            echo '## NCAAB angle testing'
            echo '```'
            cat ncaab.txt 2>/dev/null || echo "(no output — see the step log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
