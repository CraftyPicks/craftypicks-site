name: Probe score sources

# Why this exists
# ---------------
# scripts/results.py reads finals from two places now, and neither is reachable
# from the sandbox this project is developed in. The parsers are tested against
# recorded fixtures; this checks the live sources from a runner that can
# actually reach them.
#
# What changed on 2026-09-01
# --------------------------
# The first version of this probe checked ESPN's free scoreboard for the three
# non-baseball leagues. ESPN answers a GitHub runner with 403 Forbidden. A
# browser User-Agent did not change it, and the same URL serves valid JSON from
# elsewhere, so it is our address being refused and no header fixes it. Those
# leagues now buy their scores from the Odds API instead.
#
# So this probe spends credits: two per in-season league that is not baseball.
# It is workflow_dispatch only and must stay that way — a scheduled probe would
# quietly bill you for asking whether the bill works.
#
# The team-name question has narrowed. The three paid leagues take both their
# odds and their scores from the Odds API, so their club names agree by
# construction. Baseball does not: the board's names come from the Odds API and
# its finals come from MLB StatsAPI. That is the one remaining pair that can
# disagree, and it is what the comparison below checks.
#
# This file cannot be delivered through the update archive — GITHUB_TOKEN may
# not write anything under .github/workflows — so it is pasted in by hand.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date to probe, YYYY-MM-DD (blank = yesterday)"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reachability and team-name agreement
        working-directory: craftypicks
        env:
          PROBE_DATE: ${{ inputs.date }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 - <<'PY'
          import datetime, os, sys
          sys.path.insert(0, "scripts")
          import results
          from odds_client import OddsClient

          day = (os.environ.get("PROBE_DATE") or "").strip()
          if not day:
              day = (datetime.date.today()
                     - datetime.timedelta(days=1)).isoformat()
          print(f"probing {day}\n")

          client = OddsClient()
          in_season = set(client.in_season_sports())
          print(f"in season: {', '.join(sorted(in_season)) or 'nothing'}\n")

          failures = []
          for league in ("mlb", "nfl", "nba", "ncaab"):
              sport_key = results.SPORT_KEY[league]
              playing = sport_key in in_season
              source = "statsapi (free)" if league == "mlb" else "odds api (2cr)"
              if not playing:
                  print(f"{league:6} skipped — out of season")
                  continue
              try:
                  rows = results.finals(league, day, client=client)
              except Exception as e:                          # noqa: BLE001
                  print(f"{league:6} RAISED  {type(e).__name__}: {e}")
                  failures.append(f"{league} raised {type(e).__name__}")
                  continue
              note = "" if rows else "  <-- in season but nothing came back"
              print(f"{league:6} {len(rows):3} final(s)  via {source}{note}")
              if not rows:
                  failures.append(f"{league} returned nothing while in season")

          # The one pair of sources that can still disagree: baseball's board
          # names come from the Odds API, its finals from MLB StatsAPI. Nothing
          # consumes both today — MLB is rated by slate.py, not from the results
          # store — but the moment something does, a spelling difference would
          # split a club's rating history with nothing looking wrong.
          print("\n--- MLB club names: StatsAPI (finals) vs Odds API (board)")
          try:
              stats_rows = results.finals("mlb", day)
              stats_names = {r[k] for r in stats_rows for k in ("home", "away")}
              odds_rows = client.scores("baseball_mlb")
              odds_names = set()
              for ev in odds_rows:
                  for k in ("home_team", "away_team"):
                      if ev.get(k):
                          odds_names.add(ev[k])

              print(f"  StatsAPI: {len(stats_names)} club(s)   "
                    f"Odds API: {len(odds_names)} club(s)")
              if not stats_names or not odds_names:
                  print("  one source returned no games; cannot compare today")
                  print("  (re-run against a date both cover before trusting this)")
              else:
                  only_stats = sorted(stats_names - odds_names)
                  only_odds = sorted(odds_names - stats_names)
                  if only_stats or only_odds:
                      print("  MISMATCH — these do not appear in both:")
                      for n in only_stats:
                          print(f"    StatsAPI only: {n!r}")
                      for n in only_odds:
                          print(f"    Odds API only: {n!r}")
                      failures.append("MLB club names differ between sources")
                  else:
                      print("  every club spelled identically in both")
          except Exception as e:                              # noqa: BLE001
              print(f"  comparison failed: {type(e).__name__}: {e}")
              failures.append("name comparison raised")

          print(f"\ncredits used this run: {client.credits_used_this_run}")
          if client.credits_remaining is not None:
              print(f"credits remaining: {client.credits_remaining}")

          if failures:
              print("\nFAILED:")
              for f in failures:
                  print(f"  {f}")
              sys.exit(1)
          print("\nevery in-season source answered, and the names agree")
          PY
