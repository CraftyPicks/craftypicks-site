name: Post daily plays

on:
  schedule:
    # Two facts drive this schedule.
    #
    # First, cron is UTC and has no timezone support, so 9 AM in New York is a
    # different UTC hour in summer than in winter. Both hours are listed.
    #
    # Second — and this is the one that matters — GitHub does not run these
    # when it says it will. This repo's own history has a scheduled run fire
    # two and a half hours late. So the extra firings below are not "retries"
    # in the sense of recovering from an error; they are extra chances for a
    # scheduler that is allowed to be arbitrarily late or to drop a run
    # outright. run_daily.py exits immediately if today's card is already
    # committed, so every firing after the first costs nothing.
    - cron: "0,20,40 13 * * *"    # 9 AM ET while daylight saving is in effect
    - cron: "0,20,40 14 * * *"    # 9 AM ET the rest of the year
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-plays
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    # Without this, a hung upstream request can leave the job sitting for the
    # default six hours, burning Actions minutes for nothing.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: craftypicks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Is it too early to post?
        id: gate
        shell: bash
        run: |
          hour=$(TZ=America/New_York date +%H)
          # The only thing this gate exists for is the winter half of the
          # schedule: 13:00 UTC is 8 AM in New York once the clocks go back,
          # and the site promises 9. It deliberately does NOT check for an
          # exact hour — a delayed run is still a run, and refusing a late
          # one because it isn't 9 o'clock any more would throw away the card
          # entirely. Late is fine. Early is not.
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ "$hour" -lt 9 ]; then
            echo "It is ${hour}:00 in New York — too early. Skipping; the later"
            echo "firing will post the card."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Proceeding (local hour ${hour}, event ${GITHUB_EVENT_NAME})."
          fi

      - name: Run the scanner, grade yesterday, rebuild the site
        if: steps.gate.outputs.skip != 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # A manual run always posts. A scheduled firing stops early, before
          # spending a credit, if today's card is already in the repo — which
          # is what makes six firings a day safe.
          CRAFTYPICKS_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          # Unbuffered, so a crash doesn't swallow the last lines of the log —
          # which is exactly when the log matters most.
          PYTHONUNBUFFERED: "1"
        run: python scripts/run_daily.py

      - name: Commit the day's card
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "craftypicks-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -- data '*.html' ':(exclude)_src/**'
          # Git does this globbing, not the shell, so it reaches every
          # directory depth -- root pages, league boards, and any page type
          # added later. The plain shell globs this replaced matched only
          # *.html and */index.html, which silently dropped the form pages the
          # day they were added. _src is excluded because its .body.html files
          # are templates, not output.
          left=$(git status --porcelain -- '*.html' | grep -v '^[AMD]' || true)
          if [ -n "$left" ]; then
            echo "Built pages that were not staged:"; echo "$left"; exit 1
          fi
          if git diff --staged --quiet; then
            echo "Nothing changed today."
            exit 0
          fi
          git commit -m "plays: $(date -u +%Y-%m-%d)"

          # The closing-line job pushes to this same branch, so a plain push
          # can be rejected as non-fast-forward — after the credits have
          # already been spent. Rebase onto whatever landed and retry.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying in 10s."
            sleep 10
          done
          echo "Could not push after 3 attempts."
          exit 1
