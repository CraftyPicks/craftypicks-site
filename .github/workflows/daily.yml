name: Post daily plays

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-plays
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: craftypicks

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the scanner, grade yesterday, rebuild the site
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/run_daily.py

      - name: Commit the day's card
        run: |
          git config user.name  "craftypicks-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data *.html
          if git diff --staged --quiet; then
            echo "Nothing changed today."
          else
            git commit -m "plays: $(date -u +%Y-%m-%d)"
            git push
          fi
